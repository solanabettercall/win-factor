services:
  parser:
    container_name: parser
    build:
      context: ./parser
      dockerfile: Dockerfile.dev
    develop:
      watch:
        - action: sync
          path: ./parser/src
          target: /app/src
          ignore:
            - node_modules/
            - dist/

        - action: sync
          path: ./test
          target: ./parser/test

        - action: rebuild
          path: ./parser/yarn.lock
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    command: yarn run start:dev
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:${PARSER_HEALTHCHECK_PORT}/health || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      cloudflare_proxy:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    restart: always

  cloudflare_proxy:
    container_name: cloudflare_proxy
    build: ./cloudscraper
    expose:
      - ${CLOUFLAREBYPASS_PROXY_PORT}
    env_file:
      - .env
    restart: always

  redis:
    container_name: redis
    image: redis/redis-stack:7.4.0-v3
    restart: always
    ports:
      - "${REDIS_WEB_PORT}:8001"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--port ${REDIS_PORT} --save 60 1 --loglevel warning --activedefrag no
    healthcheck:
      test:
        ["CMD", "redis-cli", "-h", "localhost", "-p", "${REDIS_PORT}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    expose:
      - ${REDIS_PORT}

  postgres:
    image: postgres:14.18-bookworm
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 10s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.5.0
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pgadmin.com
      PGADMIN_DEFAULT_PASSWORD: password
      PGADMIN_LISTEN_PORT: 80
    ports:
      - 15432:80
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  redis_data:
  mongo_data:
  postgres_data:
  pgadmin:
